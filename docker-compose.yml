# =====================================================================
# 여백(旅白) 배포 구성
#   web     : Caddy — Expo 웹 빌드 서빙 + /api·/ws 리버스 프록시 + 자동 HTTPS
#   backend : Spring Boot (Java 21)
#   ai      : FastAPI + Gemini — backend와 네트워크 공간을 공유
#   db      : MySQL 8.0 (공개 콘텐츠 데이터만 초기 적재)
#
# 팀 레포 코드는 수정하지 않고 additional_contexts로 읽어서 빌드합니다.
# =====================================================================
name: yeoback

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/gen-secrets.sh}
      MYSQL_DATABASE: yeoback_db
      MYSQL_USER: yeoback
      MYSQL_PASSWORD: ${DB_PASSWORD:?run scripts/gen-secrets.sh}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 2GB 서버 메모리 절약
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - db_data:/var/lib/mysql
      # 볼륨이 비어 있을 때(최초 1회)만 db/init/*.sql 실행
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  backend:
    build:
      context: ./backend
      additional_contexts:
        app: ${APP_DIR:-./app}/YeoBack-BE
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: db:3306
      DB_USERNAME: yeoback
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?run scripts/gen-secrets.sh}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:?run scripts/gen-secrets.sh}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?run scripts/gen-secrets.sh}
      CORS_ALLOWED_ORIGIN: ${PUBLIC_URL}
      APP_INVITATION_FRONTEND_URL: ${PUBLIC_URL}
      TOUR_API_KEY: ${TOUR_API_KEY:-TOUR_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME:-not-configured@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-not-configured}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true
      TZ: Asia/Seoul
    volumes:
      # 플래너·프로필·챌린지 이미지 업로드 (컨테이너를 다시 만들어도 유지)
      - uploads:/app/uploads

  ai:
    build:
      context: ./ai
      additional_contexts:
        app: ${APP_DIR:-./app}/YeoBack-AI
      args:
        GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    restart: unless-stopped
    # 팀 코드(AIPlanService)에 AI 서버 주소가 http://localhost:8001 로 고정되어 있어
    # backend 컨테이너의 네트워크를 공유시켜 localhost로 통신하게 함
    network_mode: "service:backend"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DB_URL: mysql+pymysql://yeoback:${DB_PASSWORD}@db:3306/yeoback_db?charset=utf8mb4
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      TZ: Asia/Seoul

  web:
    build:
      context: ./web
      additional_contexts:
        app: ${APP_DIR:-./app}/YeoBack-FE-native
      args:
        PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
        KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # HTTPS 인증서 보관 (재발급 횟수 제한 방지)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
